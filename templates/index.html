<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Financeiro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Finance Dashboard</h1>

    <div class="card">
        <h2>Saldo: R$ {{ saldo }}</h2>
        <h3>Dólar: R$ {{ dolar }}</h3>

        <div class="alert {% if 'gastando mais' in alerta %}bad{% else %}good{% endif %}">
            {{ alerta }}
        </div>
    </div>

    <div class="card">
        <h2>Adicionar Transação</h2>

        <form method="POST" action="/adicionar">

            <input name="nome" placeholder="Descrição">
            <input name="valor" type="number" step="0.01">

            <select name="tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>

            <button type="submit">Adicionar</button>

        </form>
    </div>

    <div class="card">
        <h2>Gráfico</h2>
        <img src="/{{ grafico }}" width="100%">
    </div>

    <div class="card">
        <h2>Transações</h2>

        <ul>
        {% for t in transacoes %}
            <li>{{ t.nome }} - R$ {{ t.valor }} ({{ t.tipo }})</li>
        {% endfor %}
        </ul>
    </div>

    <div class="card">
        <a href="/logout"><button>Sair</button></a>
    </div>

</div>

</body>
</html>
